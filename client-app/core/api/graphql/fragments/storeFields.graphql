#import "./allCurrencyFields.graphql"
#import "./allLanguageFields.graphql"

fragment storeResponseTypeFields on StoreResponseType {
  storeId
  storeName
  catalogId
  storeUrl
  defaultLanguage {
    ...allLanguageFields
  }
  availableLanguages {
    ...allLanguageFields
  }
  defaultCurrency {
    ...allCurrencyFields
  }
  availableCurrencies {
    ...allCurrencyFields
  }
  settings {
    authenticationTypes
    taxCalculationEnabled
    anonymousUsersAllowed
    environmentName
    emailVerificationEnabled
    emailVerificationRequired
    seoLinkType
    passwordRequirements {
      requireLowercase
      requireUppercase
      requireDigit
      requiredLength
      requiredUniqueChars
      requireNonAlphanumeric
    }
    modules {
      moduleId
      settings {
        name
        value
      }
    }
  }
}
