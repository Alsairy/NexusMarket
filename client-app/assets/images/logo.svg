<svg width="183" height="45" viewBox="0 0 183 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nexus Market Logo - Dark text on transparent -->
  <!-- N Icon Mark with interconnected nodes -->
  <g fill="#FF6037">
    <!-- Left vertical stroke -->
    <rect x="0.5" y="4" width="6" height="32" rx="1.5"/>
    <!-- Right vertical stroke -->
    <rect x="26.5" y="4" width="6" height="32" rx="1.5"/>
    <!-- Diagonal bridge -->
    <polygon points="4.5,4 9,4 29,36 24.5,36"/>
    <!-- Top-left node -->
    <circle cx="4.2" cy="6.5" r="5"/>
    <!-- Bottom-left node -->
    <circle cx="4.2" cy="33.5" r="5"/>
    <!-- Top-right node -->
    <circle cx="28.8" cy="6.5" r="5"/>
    <!-- Bottom-right node -->
    <circle cx="28.8" cy="33.5" r="5"/>
    <!-- Center interconnect node -->
    <circle cx="16.5" cy="20" r="3.8"/>
  </g>
  <!-- Text: NEXUS MARKET -->
  <text x="40" y="25" fill="#161D25" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">NEXUS</text>
  <text x="109" y="25" fill="#161D25" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="1.5">MARKET</text>
  <!-- Accent line -->
  <rect x="40" y="30" width="138" height="0.8" rx="0.4" fill="#FF6037" opacity="0.35"/>
</svg>